<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>Vista móvil · DECOKASA</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#f3f3f1;color:#202124;font:14px/1.4 Arial,sans-serif}
    main{display:grid;justify-items:center;gap:14px}
    h1{margin:0;font-size:16px;font-weight:600}
    .phone{width:min(406px,calc(100vw - 32px));height:min(860px,calc(100dvh - 82px));min-height:400px;overflow:hidden;border:8px solid #151719;border-radius:32px;background:#fff;box-shadow:0 18px 50px #0002}
    iframe{display:block;width:100%;height:100%;border:0;background:white}
    @media(max-height:500px){body{padding:10px}.phone{height:calc(100dvh - 54px);min-height:320px;border-radius:22px}}
  </style>
</head>
<body>
  <main>
    <h1>Vista móvil · 390 × 844</h1>
    <div class="phone"><iframe src="DECOKASA-inicio.html" title="Portada DECOKASA en vista móvil"></iframe></div>
  </main>
</body>
</html>
